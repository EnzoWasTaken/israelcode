name: Release

# Build + sign + publish the gg-app desktop bundle for Windows on a tag push
# (v*). This fork ships Windows only (personal use): macOS and Linux legs and
# their signing are intentionally removed. The runner stages its own Node
# runtime and bundles the sidecar (so native binaries match the target), then
# tauri-action builds the NSIS installer, signs the updater artifact, uploads
# both to a published (non-draft) GitHub release, and generates `latest.json`
# for the updater endpoint.
#
# Required secrets (in the protected `desktop-production` environment):
#   TAURI_SIGNING_PRIVATE_KEY           — minisign private key (must match the
#                                         `plugins.updater.pubkey` in tauri.conf.json)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — password for that key
# Preflight fails closed before any build if either is absent; unsigned
# releases are never produced. No Authenticode certificate is used, so
# SmartScreen shows an "unknown publisher" prompt on first install.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: desktop-production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag and every release credential
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit on origin/main" >&2
            exit 1
          }
          required=(TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || {
              echo "Missing protected release secret: $name" >&2
              exit 1
            }
          done
          # The updater rejects every update if the app ships without a pubkey.
          node -e '
            const c = JSON.parse(require("fs").readFileSync("gg-app/src-tauri/tauri.conf.json", "utf8"));
            if (!c.plugins?.updater?.pubkey) { console.error("plugins.updater.pubkey is empty"); process.exit(1); }
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (c.version !== tag) { console.error(`tauri.conf.json version ${c.version} != tag ${tag}`); process.exit(1); }
          '

  # Create (or find) the GitHub release once, before the build, with retries.
  # With `releaseId` tauri-action only uploads, and uploads retry.
  create-release:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Create or find the release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          # Notes come from the in-app "What's new" entry for this version.
          body=$(node .github/ci/release-notes.mjs "$TAG") ||
            body="Download the Windows installer from the assets below."
          id=""
          for attempt in 1 2 3 4 5 6; do
            # GET first: a create that 500s may still have made the release.
            id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id 2>/dev/null) && break
            id=$(gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f name="israel-code $TAG" \
              -f body="$body" \
              -F draft=false -F prerelease=false --jq .id) && break
            id=""
            echo "Release lookup/create failed (attempt $attempt); retrying" >&2
            sleep $((attempt * 10))
          done
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "Could not create or find release $TAG" >&2; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: [preflight, create-release]
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 100
    environment:
      name: desktop-production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate protected release context
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit on origin/main" >&2
            exit 1
          }
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || {
              echo "Missing protected release secret: $name" >&2
              exit 1
            }
          done

      # pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gg-app/src-tauri

      - name: Install
        shell: bash
        run: pnpm install --frozen-lockfile

      # shell: bash is load-bearing on Windows: PowerShell only fails on the
      # LAST line of a multi-line script, so a failing early build would be
      # swallowed and we'd ship an installer built from stale artifacts.
      - name: Build framework packages
        shell: bash
        run: |
          pnpm --filter @kenkaiiii/gg-ai build
          pnpm --filter @kenkaiiii/gg-agent build
          pnpm --filter @kenkaiiii/gg-core build
          pnpm --filter @kenkaiiii/ggcoder build

      - name: Stage node runtime + bundle sidecar
        shell: bash
        run: |
          pnpm --filter gg-app stage:node
          pnpm --filter gg-app bundle:sidecar

      - name: Sidecar smoke (bundled runtime + bundle)
        shell: bash
        run: node gg-app/scripts/smoke-sidecar.mjs

      # NSIS only: one installer type, so `latest.json` and the in-app updater
      # always agree (the app installs per-user via NSIS `currentUser`).
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: gg-app
          # Upload-only into the release created above (no create/update calls).
          releaseId: ${{ needs.create-release.outputs.id }}
          # Retries a failed asset or latest.json upload (GitHub 5xx).
          retryAttempts: 3
          # Generates + uploads `latest.json` for the updater endpoint.
          uploadUpdaterJson: true
          args: "--bundles nsis"
